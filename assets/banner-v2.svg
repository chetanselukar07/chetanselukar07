  <text x="600" y="210" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" letter-spacing="2">CHETAN SELUKAR</text>
  <text x="600" y="245" text-anchor="middle" fill="#E6F7FF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500">Technical Architect | AI Developer</text>
  <text x="600" y="275" text-anchor="middle" fill="#8BE9FF" font-family="Arial, Helvetica, sans-serif" font-size="14">.NET Core | Angular | Azure | Microservices | CI/CD</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">
