    <rect x="820" y="195" width="50" height="125" fill="#0A1524" stroke="#00F0FF" stroke-width="1"/>
    <rect x="880" y="155" width="65" height="165" fill="#0C1A32" stroke="#39FF14" stroke-width="1.2"/>
    <rect x="955" y="210" width="40" height="110" fill="#0A1524" stroke="#00F0FF" stroke-width="1"/>
    <rect x="1005" y="175" width="55" height="145" fill="#0B1830" stroke="#00F0FF" stroke-width="1"/>
    <rect x="1070" y="220" width="45" height="100" fill="#0A1524" stroke="#39FF14" stroke-width="1"/>
    <g fill="#00F0FF" opacity="0.7">
