      <rect x="140" y="215" width="6" height="8" rx="1"/><rect x="155" y="215" width="6" height="8" rx="1"/>
      <rect x="265" y="180" width="7" height="9" rx="1"/><rect x="280" y="180" width="7" height="9" rx="1"/>
      <rect x="895" y="175" width="7" height="9" rx="1"/><rect x="910" y="175" width="7" height="9" rx="1"/>
    </g>
  </g>

  <rect x="0" y="318" width="1200" height="2" fill="url(#neonCyan)" opacity="0.8"/>
  <path d="M0 330 H1200" stroke="#39FF14" stroke-width="1" opacity="0.35"/>

