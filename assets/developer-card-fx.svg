<svg xmlns="http://www.w3.org/2000/svg" width="400" height="540" viewBox="0 0 400 540" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="20" y1="20" x2="380" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="55%" stop-color="#0A1A2E"/>
      <stop offset="100%" stop-color="#071525"/>
    </linearGradient>
    <linearGradient id="border" x1="20" y1="20" x2="380" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="vGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#39FF14"/>
    </linearGradient>
    <linearGradient id="shine" x1="40" y1="30" x2="200" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#39FF14" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="miniGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#00F0FF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="400" height="8" patternUnits="userSpaceOnUse">
      <rect width="400" height="1" fill="#00F0FF" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Outer neon aura -->
  <rect x="18" y="18" width="364" height="504" rx="26" fill="url(#aura)"/>
  <rect x="14" y="14" width="372" height="512" rx="28" fill="none" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="6" filter="url(#neon)"/>
  <rect x="18" y="18" width="364" height="504" rx="26" fill="none" stroke="#39FF14" stroke-opacity="0.2" stroke-width="3" filter="url(#neon)"/>

  <!-- Card body -->
  <rect x="28" y="28" width="344" height="484" rx="22" fill="url(#cardBg)" stroke="url(#border)" stroke-width="2.5"/>
  <rect x="28" y="28" width="344" height="484" rx="22" fill="url(#miniGrid)"/>
  <rect x="28" y="28" width="344" height="484" rx="22" fill="url(#scan)"/>
  <path d="M28 28 H220 V180 H28 Z" fill="url(#shine)"/>

  <!-- Top bar -->
  <rect x="28" y="28" width="344" height="40" rx="22" fill="#061525"/>
  <rect x="28" y="48" width="344" height="20" fill="#061525"/>
  <text x="200" y="54" text-anchor="middle" fill="#00F0FF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3">DEVELOPER ID</text>

  <!-- Status dots -->
  <circle cx="48" cy="48" r="4" fill="#39FF14" filter="url(#neon)"/>
  <circle cx="62" cy="48" r="4" fill="#00F0FF" opacity="0.85"/>
  <circle cx="352" cy="48" r="4" fill="#39FF14" opacity="0.7"/>

  <!-- Avatar rings -->
  <circle cx="200" cy="145" r="74" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.35" filter="url(#neon)"/>
  <circle cx="200" cy="145" r="68" fill="none" stroke="#00F0FF" stroke-width="2"/>
  <circle cx="200" cy="145" r="64" fill="none" stroke="#39FF14" stroke-width="1.5" opacity="0.75"/>
  <circle cx="200" cy="145" r="58" fill="#071525" stroke="#39FF14" stroke-width="1"/>
  <text x="200" y="158" text-anchor="middle" fill="#39FF14" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">CS</text>

  <!-- Identity -->
  <text x="200" y="240" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">Chetan Selukar</text>
  <text x="200" y="268" text-anchor="middle" fill="#39FF14" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Technical Architect</text>
  <text x="200" y="290" text-anchor="middle" fill="#8BE9FF" font-family="Arial, Helvetica, sans-serif" font-size="12">AI Developer | .NET | Azure</text>
  <text x="200" y="312" text-anchor="middle" fill="#A0B4C8" font-family="Arial, Helvetica, sans-serif" font-size="12">14+ Years | Ahmedabad, India</text>

  <path d="M70 330 H330" stroke="url(#border)" stroke-width="1" opacity="0.75"/>

  <!-- VedAutom -->
  <g transform="translate(160,345)">
    <rect x="0" y="0" width="80" height="48" rx="12" fill="#071525" stroke="url(#vGrad)" stroke-width="1.5"/>
    <path d="M22 38 L40 10 L58 38 H48 L40 24 L32 38 Z" fill="url(#vGrad)"/>
  </g>
  <text x="200" y="415" text-anchor="middle" fill="#00F0FF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2">VEDAUTOM</text>
  <text x="200" y="434" text-anchor="middle" fill="#7F98B0" font-family="Arial, Helvetica, sans-serif" font-size="11">Scalable Enterprise Systems</text>

  <!-- QR -->
  <g transform="translate(155,450)">
    <rect x="0" y="0" width="90" height="50" rx="8" fill="#050A12" stroke="#00F0FF" stroke-width="1.2"/>
    <g fill="#39FF14">
      <rect x="10" y="8" width="10" height="10"/><rect x="22" y="8" width="4" height="4"/><rect x="28" y="8" width="10" height="10"/>
      <rect x="10" y="20" width="4" height="4"/><rect x="16" y="20" width="10" height="4"/><rect x="28" y="22" width="4" height="4"/><rect x="34" y="20" width="4" height="10"/>
      <rect x="10" y="32" width="10" height="10"/><rect x="22" y="34" width="4" height="4"/><rect x="28" y="32" width="10" height="10"/>
      <rect x="48" y="8" width="8" height="8"/><rect x="60" y="10" width="4" height="4"/><rect x="68" y="8" width="12" height="12"/>
      <rect x="48" y="22" width="4" height="8"/><rect x="56" y="24" width="12" height="4"/><rect x="72" y="22" width="8" height="8"/>
      <rect x="48" y="34" width="10" height="8"/><rect x="62" y="36" width="4" height="4"/><rect x="70" y="34" width="10" height="8"/>
    </g>
  </g>
  <text x="200" y="520" text-anchor="middle" fill="#8BE9FF" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">SCAN TO CONNECT</text>

  <!-- Corner brackets -->
  <g stroke="#39FF14" stroke-width="2.2" fill="none" opacity="0.9" filter="url(#neon)">
    <path d="M48 68 V48 H68"/>
    <path d="M332 48 H352 V68"/>
    <path d="M48 472 V492 H68"/>
    <path d="M332 492 H352 V472"/>
  </g>
  <g stroke="#00F0FF" stroke-width="1.2" fill="none" opacity="0.55">
    <path d="M56 62 V56 H62"/>
    <path d="M338 56 H344 V62"/>
  </g>
</svg>
