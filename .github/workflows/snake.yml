name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - development
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate personal snake (chetanselukar07)
        uses: Platane/snk@v2
        with:
          github_user_name: chetanselukar07
          outputs: |
            assets/animations/github-contribution-grid-snake.svg
            assets/animations/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate Thinksmart snake (chetanthinksmart)
        uses: Platane/snk@v2
        with:
          github_user_name: chetanthinksmart
          outputs: |
            assets/animations/thinksmart-contribution-grid-snake.svg
            assets/animations/thinksmart-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit and push snakes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution snakes (personal + thinksmart)"
          file_pattern: assets/animations/*.svg
